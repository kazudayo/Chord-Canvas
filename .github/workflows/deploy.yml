name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          HARMOTRAIL_AUTH_USER_HASH: ${{ secrets.HARMOTRAIL_AUTH_USER_HASH }}
          HARMOTRAIL_AUTH_PASSWORD_HASH: ${{ secrets.HARMOTRAIL_AUTH_PASSWORD_HASH }}
          CHORD_AUTH_USER_HASH: ${{ secrets.CHORD_AUTH_USER_HASH }}
          CHORD_AUTH_PASSWORD_HASH: ${{ secrets.CHORD_AUTH_PASSWORD_HASH }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
